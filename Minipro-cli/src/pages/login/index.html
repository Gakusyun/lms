<view class="login-page">
  <view class="login-container">
    <view class="login-card">
      <!-- Logo区域 - 与 Web App 对齐 -->
      <view class="login-header">
        <view class="login-logo">
          <text class="logo-icon">📚</text>
        </view>
        <text class="login-title">请假管理系统</text>
        <text class="login-subtitle">欢迎回来，请登录您的账户</text>
      </view>

      <!-- 登录表单 -->
      <view class="login-form-container">
        <view class="login-form">
          <!-- 账号输入 -->
          <view class="form-group">
            <text class="form-label">账号</text>
            <input class="form-input" placeholder="请输入用户ID" value="{{loginForm.id}}" bindinput="onIdInput" />
          </view>

          <!-- 密码输入 -->
          <view class="form-group">
            <text class="form-label">密码</text>
            <input class="form-input" placeholder="请输入密码" password="{{true}}" value="{{loginForm.password}}"
              bindinput="onPasswordInput" />
          </view>

          <button class="login-btn {{loading ? 'loading' : ''}}" bindtap="handleLogin" disabled="{{loading}}">
            {{loading ? '登录中...' : '登录'}}
          </button>

          <view wx:if="{{errorMessage}}" class="alert alert-danger">
            <text>{{errorMessage}}</text>
          </view>
        </view>
      </view>
    </view>
  </view>
</view>
