<view class="list-page">
  <view class="page-header">
    <view class="header-content">
      <text class="page-title">课程管理</text>
      <view class="header-buttons">
        <button class="btn btn-back btn-sm" bindtap="goBack">返回</button>
      </view>
    </view>
  </view>

  <view class="stats-card">
    <text class="stats-text">共 {{total}} 门课程 (第 {{page}} / {{totalPages || 1}} 页)</text>
  </view>

  <scroll-view scroll-y class="scroll-container" bindscrolltolower="loadMore">
    <view wx:if="{{courses.length > 0}}" class="card-list">
      <view wx:for="{{courses}}" wx:key="course_id" class="card">
        <view class="card-header">
          <text class="card-title">{{item.course_name}}</text>
          <button class="btn btn-primary btn-sm" data-course-id="{{item.course_id}}" bindtap="viewDetail">详情</button>
          <button class="btn btn-secondary btn-sm" data-course-id="{{item.course_id}}" bindtap="viewStudents">学生</button>
        </view>
        <view class="card-row">
          <text class="card-label">课程ID</text>
          <text class="card-value">{{item.course_id}}</text>
        </view>
        <view class="card-row">
          <text class="card-label">课时</text>
          <text class="card-value">{{item.class_hours || '-'}}</text>
        </view>
        <view class="card-row">
          <text class="card-label">教师</text>
          <text class="card-value">{{item.teacher_name || '-'}}</text>
        </view>
        <view class="card-row">
          <text class="card-label">选课人数</text>
          <text class="card-value">{{item.enrollment_count || 0}} 人</text>
        </view>
      </view>
    </view>

    <view wx:if="{{loading}}" class="loading">
      <text>正在加载...</text>
    </view>

    <view wx:if="{{!loading && courses.length === 0}}" class="empty-state">
      <text class="empty-icon">📋</text>
      <text class="empty-title">暂无课程数据</text>
      <text class="empty-desc">请等待课程添加完成后再来查看</text>
    </view>
  </scroll-view>
</view>
