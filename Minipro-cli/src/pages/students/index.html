<view class="list-page">

  <!-- 统计卡片 -->
  <view class="stats-card">
    <text class="stats-text">共 {{total}} 名学生 (第 {{page}} / {{totalPages || 1}} 页)</text>
  </view>

  <!-- 卡片列表 -->
  <scroll-view scroll-y class="scroll-container" bindscrolltolower="loadMore">
    <view wx:if="{{students.length > 0}}" class="card-list">
      <view wx:for="{{students}}" wx:key="student_id" class="card">
        <view class="card-header">
          <text class="card-title">#{{item.student_id}} {{item.student_name}}</text>
          <button class="btn btn-primary btn-sm" data-student-id="{{item.student_id}}" bindtap="viewDetail">详情</button>
        </view>
        <view class="card-row">
          <text class="card-label">院系</text>
          <text class="card-value">{{item.school_name || '-'}}</text>
        </view>
        <view class="card-row">
          <text class="card-label">审核人</text>
          <text class="card-value">{{item.reviewer_name || '-'}}</text>
        </view>
      </view>
    </view>

    <!-- 加载状态 -->
    <view wx:if="{{loading}}" class="loading">
      <text>正在加载...</text>
    </view>

    <!-- 空状态 -->
    <view wx:if="{{!loading && students.length === 0}}" class="empty-state">
      <text class="empty-icon">👨‍🎓</text>
      <text class="empty-title">暂无学生数据</text>
      <text class="empty-desc">请等待学生添加完成后再来查看</text>
    </view>
  </scroll-view>
</view>
