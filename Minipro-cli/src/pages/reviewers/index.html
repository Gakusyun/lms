<view class="list-page">
  <view class="page-header">
    <view class="header-content">
      <text class="page-title">审核员管理</text>
      <view class="header-buttons">
        <button class="btn btn-back btn-sm" bindtap="goBack">返回</button>
      </view>
    </view>
  </view>

  <view class="stats-card">
    <text class="stats-text">共 {{total}} 名审核员 (第 {{page}} / {{totalPages || 1}} 页)</text>
  </view>

  <scroll-view scroll-y class="scroll-container" bindscrolltolower="loadMore">
    <view wx:if="{{reviewers.length > 0}}" class="card-list">
      <view wx:for="{{reviewers}}" wx:key="reviewer_id" class="card">
        <view class="card-header">
          <text class="card-title">#{{item.reviewer_id}} {{item.reviewer_name}}</text>
          <button class="btn btn-primary btn-sm" data-reviewer-id="{{item.reviewer_id}}" bindtap="viewDetail">详情</button>
        </view>
        <view class="card-row">
          <text class="card-label">职务</text>
          <text class="card-value">{{item.role_name || '-'}}</text>
        </view>
        <view class="card-row">
          <text class="card-label">院系</text>
          <text class="card-value">{{item.school_name || '-'}}</text>
        </view>
      </view>
    </view>

    <view wx:if="{{loading}}" class="loading">
      <text>正在加载...</text>
    </view>

    <view wx:if="{{!loading && reviewers.length === 0}}" class="empty-state">
      <text class="empty-icon">✅</text>
      <text class="empty-title">暂无审核员数据</text>
      <text class="empty-desc">请等待审核员添加完成后再来查看</text>
    </view>
  </scroll-view>
</view>
